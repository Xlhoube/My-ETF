<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="100" rx="28" fill="#000000" />
  <defs>
    <linearGradient id="favGrad" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stopColor="#10b981" />
      <stop offset="50%" stopColor="#2dd4bf" />
      <stop offset="100%" stopColor="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Radar Waves -->
  <path d="M 16,50 A 34,34 0 0,1 84,50" stroke="url(#favGrad)" stroke-width="4.5" stroke-linecap="round" opacity="0.4" />
  <path d="M 25,50 A 25,25 0 0,1 75,50" stroke="url(#favGrad)" stroke-width="5" stroke-linecap="round" opacity="0.7" />

  <!-- Shield -->
  <path d="M 50,18 L 76,28 C 76,55 50,82 50,82 C 50,82 24,55 24,28 Z" stroke="url(#favGrad)" stroke-width="5" fill="rgba(16, 185, 129, 0.12)" stroke-linejoin="round" />

  <!-- Growth Arrow -->
  <path d="M 33,56 L 44,43 L 53,52 L 72,28" stroke="url(#favGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 60,27 L 73,27 L 73,40" stroke="url(#favGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
</svg>
